<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Flux — Write. Pipe. Repeat.</title>
  <desc id="desc">An editorial poster for the Flux programming language, with oversized black lettering, a dotted ivory canvas, a rose pipeline symbol, and a small terminal example.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#202020" opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" rx="18" fill="#f7f5ef"/>
  <rect width="1280" height="800" rx="18" fill="url(#dots)"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#191919">
    <text x="54" y="67" font-size="36" font-weight="800" font-style="italic" letter-spacing="-2">flux.</text>
    <g font-family="Menlo, Consolas, monospace" font-size="12" letter-spacing="2">
      <text x="800" y="59">LANGUAGE</text>
      <text x="957" y="59" fill="#77766e">INTERPRETER</text>
      <text x="1150" y="59" fill="#77766e">V1.0.0</text>
    </g>
    <g font-size="16" fill="#66665e">
      <text x="56" y="179">A small language.</text>
      <text x="56" y="204">A little curiosity.</text>
      <text x="56" y="229">A whole lot of flow.</text>
    </g>
    <g font-size="148" font-weight="300" letter-spacing="5">
      <text x="306" y="248">WRITE</text>
      <text x="53" y="390">PIPE</text>
      <text x="306" y="532">REPEAT</text>
    </g>
    <g transform="translate(468 285)" stroke="#f43f5e" stroke-width="13" fill="none" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M0 5 V92 M39 5 L91 49 L39 92"/>
    </g>
    <g font-size="16" fill="#66665e">
      <text x="667" y="325">Turn source into tokens.</text>
      <text x="667" y="350">Turn tokens into trees.</text>
      <text x="667" y="375">Watch your ideas run.</text>
    </g>
    <g transform="translate(1095 158)" stroke="#f43f5e" stroke-width="3">
      <path d="M-27 0 H27 M0 -27 V27 M-19 -19 L19 19 M-19 19 L19 -19"/>
      <circle r="8" fill="#f7f5ef"/>
    </g>
    <rect x="1236" y="278" width="44" height="207" fill="#191919"/>
    <text transform="translate(1253 465) rotate(-90)" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#f7f5ef">BUILT TO UNDERSTAND</text>
    <path d="M56 575 H1224" stroke="#c5c4ba"/>
    <text x="56" y="606" font-family="Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#66665e">AN EXPERIMENT IN MAKING CODE FLOW.</text>
    <text x="1039" y="606" font-size="22" font-style="italic" font-weight="700" fill="#d65b32">hello, flux.</text>
    <rect x="56" y="637" width="598" height="116" rx="9" fill="#20211f"/>
    <g transform="translate(77 656)">
      <circle r="3" fill="#f43f5e"/>
      <circle cx="13" r="3" fill="#bdab79"/>
      <circle cx="26" r="3" fill="#7f947a"/>
    </g>
    <g font-family="Menlo, Consolas, monospace" font-size="16">
      <text x="77" y="698" fill="#edece3"><tspan fill="#fb7185">flux&gt; </tspan>[1, 2, 3] |&gt; map(fn(x) { return x * 2 })</text>
      <text x="77" y="731" fill="#a3b99c">[2, 4, 6]</text>
    </g>
    <text x="709" y="678" font-size="22">The journey is the interpreter.</text>
    <text x="709" y="711" font-size="15" fill="#66665e">JavaScript under the hood. Flux at the prompt.</text>
    <text x="709" y="736" font-size="15" fill="#66665e">No runtime packages. Just Node.js and an idea.</text>
  </g>
</svg>
